<div
  class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
  (click)="closeModal()"
>
  <div
    class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl border border-gray-700"
    (click)="$event.stopPropagation()"
  >
    <div class="sticky top-0 bg-gray-800/95 backdrop-blur-sm px-6 py-4 border-b border-gray-700 flex items-center justify-between z-10">
      <div>
        <h2 class="text-2xl font-bold text-white">{{ termek.nev }}</h2>
        <p class="text-gray-400 text-sm">Válassz extra hozzávalókat</p>
      </div>
      <button
        (click)="closeModal()"
        class="w-10 h-10 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center transition-colors"
      >
        <svg
          class="w-6 h-6 text-white"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <div class="overflow-y-auto max-h-[calc(90vh-200px)] px-6 py-6">
      <div *ngIf="isLoading" class="flex justify-center items-center py-20">
        <div
          class="w-12 h-12 border-4 border-gray-700 border-t-[#c2e22a] rounded-full animate-spin"
        ></div>
      </div>

      <div *ngIf="!isLoading && hozzavalok.length > 0" class="mb-6">
        <h3 class="text-xl font-bold text-white mb-4">Hozzávalók</h3>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
          <div
            *ngFor="let hozzavalo of hozzavalok; let i = index"
            (click)="toggleHozzavalo(i)"
            [ngClass]="{
              'bg-[#c2e22a]/20': hozzavalo.selected,
              'border-[#c2e22a]': hozzavalo.selected,
              'bg-gray-700/30': !hozzavalo.selected,
              'border-gray-600': !hozzavalo.selected
            }"
            class="flex items-center gap-2 p-3 rounded-lg border-2 cursor-pointer transition-all duration-300 hover:border-[#c2e22a]"
          >
            <div
              [ngClass]="{
                'bg-[#c2e22a]': hozzavalo.selected,
                'border-gray-500': !hozzavalo.selected
              }"
              class="w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0"
            >
              <svg
                *ngIf="hozzavalo.selected"
                class="w-3 h-3 text-gray-900"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3"
                  d="M5 13l4 4L19 7"
                ></path>
              </svg>
            </div>
            <span class="text-white text-sm font-medium">{{ hozzavalo.nev }}</span>
          </div>
        </div>
      </div>

      <div *ngIf="!isLoading && availableExtras.length === 0 && hozzavalok.length === 0" class="text-center py-12">
        <p class="text-gray-400 text-lg">
          Ehhez a termékhez nincsenek elérhető opciók.
        </p>
      </div>

      <div *ngIf="!isLoading && availableExtras.length > 0">
        <h3 class="text-xl font-bold text-white mb-4">Extra hozzávalók</h3>
        <div class="space-y-3">
          <div
            *ngFor="let extra of availableExtras"
            class="bg-gray-700/50 rounded-xl p-4 border border-gray-600 hover:border-[#c2e22a] transition-all duration-300"
          >
            <div class="flex items-center justify-between gap-4">
              <div class="flex-1">
                <h3 class="text-white font-semibold text-lg">{{ extra.nev }}</h3>
                <p class="text-[#c2e22a] font-bold text-sm">+{{ extra.ar }} Ft</p>
              </div>

              <div class="flex items-center gap-3">
                <ng-container *ngIf="getQuantity(extra.id) > 0; else addButton">
                  <div class="flex items-center gap-2">
                    <button
                      (click)="decrement(extra)"
                      class="w-8 h-8 rounded-full bg-gray-600 hover:bg-gray-500 flex items-center justify-center transition-colors"
                    >
                      <svg
                        class="w-4 h-4 text-white"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M20 12H4"
                        ></path>
                      </svg>
                    </button>

                    <span class="text-white font-bold text-lg w-8 text-center">
                      {{ getQuantity(extra.id) }}
                    </span>

                    <button
                      (click)="increment(extra)"
                      class="w-8 h-8 rounded-full bg-[#c2e22a] hover:bg-yellow-500 flex items-center justify-center transition-colors"
                    >
                      <svg
                        class="w-4 h-4 text-gray-900"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M12 4v16m8-8H4"
                        ></path>
                      </svg>
                    </button>

                    <button
                      (click)="remove(extra.id)"
                      class="w-8 h-8 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center transition-colors ml-2"
                    >
                      <svg
                        class="w-4 h-4 text-white"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                        ></path>
                      </svg>
                    </button>
                  </div>
                </ng-container>
              
                <ng-template #addButton>
                  <button
                    (click)="increment(extra)"
                    class="px-6 py-2 rounded-full bg-[#c2e22a] hover:bg-yellow-500 text-gray-900 font-bold transition-all duration-300 hover:scale-105"
                  >
                    Hozzáad
                  </button>
                </ng-template>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="!isLoading" class="mt-6">
        <h3 class="text-xl font-bold text-white mb-3">Megjegyzés</h3>
        <textarea
          [(ngModel)]="megjegyzes"
          placeholder="Légyszi csöngess :D"
          rows="3"
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#c2e22a] focus:border-transparent resize-none"
        ></textarea>
      </div>
    </div>

    <div class="sticky bottom-0 bg-gray-800/95 backdrop-blur-sm px-6 py-4 border-t border-gray-700">
      <div class="flex items-center justify-between mb-4">
        <div>
          <p class="text-gray-400 text-sm">Alap ár</p>
          <p class="text-white font-semibold">{{ termek.ar }} Ft</p>
        </div>
        <div class="text-right">
          <p class="text-gray-400 text-sm">Végösszeg</p>
          <p class="text-[#c2e22a] font-bold text-3xl">{{ vegosszeg }} Ft</p>
        </div>
      </div>
      <button
        (click)="save()"
        class="w-full py-3 rounded-full bg-[#c2e22a] hover:bg-yellow-500 text-gray-900 font-bold text-lg transition-all duration-300 hover:scale-105 shadow-lg"
      >
        Mentés és kosárba helyezés
      </button>
    </div>
  </div>
</div>
