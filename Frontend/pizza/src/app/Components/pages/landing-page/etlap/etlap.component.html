<div class="relative py-16 bg-gradient-to-b from-black to-gray-900">
  <div class="max-w-7xl mx-auto px-4">
    <div class="text-center mb-12">
      <h2 class="text-4xl md:text-5xl font-bold text-white mb-4">
        <span class="text-[#c2e22a]">Ételválasztékunk</span>
      </h2>
      <p class="text-xl text-gray-400">Fedezd fel legkedveltebb ételeinket</p>
    </div>

    <div *ngIf="isLoading" class="flex justify-center items-center py-20">
      <div class="relative">
        <div
          class="w-16 h-16 border-4 border-gray-700 border-t-[#c2e22a] rounded-full animate-spin"
        ></div>
      </div>
    </div>

    <div
      *ngIf="!isLoading"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
    >
      <div
        *ngFor="let item of termekek; let i = index"
        [class.opacity-50]="i >= 6"
        [class.blur-sm]="i >= 6"
        class="group bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl overflow-hidden border border-gray-700 hover:border-[#c2e22a] transition-all duration-300 hover:shadow-2xl hover:shadow-[#c2e22a]/20"
      >
        <div class="relative h-56 overflow-hidden">
          <img
            [src]="item.kepURL"
            [alt]="item.nev"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
          />
          <div
            class="absolute top-3 right-3 px-3 py-1 bg-[#c2e22a] text-gray-900 font-bold rounded-full text-sm"
          >
            {{ getKategoriaNev(item.kategoriaId) }}
          </div>
          <div
            class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent opacity-60"
          ></div>
        </div>

        <div class="p-6">
          <h3
            class="text-2xl font-bold text-white mb-2 group-hover:text-[#c2e22a] transition-colors"
          >
            {{ item.nev }}
          </h3>

          <p class="text-gray-400 text-sm mb-4 line-clamp-2">
            {{ item.leiras }}
          </p>

          <div class="flex items-center gap-4 mb-4">
            <div class="flex items-center gap-1">
              <svg
                class="w-5 h-5 text-yellow-400"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                ></path>
              </svg>
              <span class="text-white font-semibold">{{
                item.averageRating.toFixed(1)
              }}</span>
              <span class="text-gray-500 text-sm"
                >({{ item.reviewCount }})</span
              >
            </div>

            <div class="flex items-center gap-1 text-gray-400 text-sm">
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
                ></path>
              </svg>
              <span>{{ item.rendelesekSzama }}x</span>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex flex-col">
              <span class="text-3xl font-bold text-[#c2e22a]"
                >{{ item.ar }} Ft</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="previewMode && !isLoading" class="relative mt-16">
      <div
        class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/50 to-transparent pointer-events-none"
        style="height: 200px; margin-top: -100px"
      ></div>
      <div class="text-center relative z-10">
        <a
          routerLink="/etlap"
          class="inline-flex items-center gap-3 px-10 py-4 bg-[#c2e22a] text-gray-900 font-bold text-xl rounded-full shadow-2xl hover:bg-yellow-500 transition-all duration-300 hover:scale-105"
        >
          <span>Teljes Étlap Megtekintése</span>
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            ></path>
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>
